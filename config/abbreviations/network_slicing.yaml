# Abbreviations for the "network_slicing" project.
#
# Used when litsuite builds a filename for a new paper, e.g.
#   "Model Predictive Control-Based Dynamic Resource Allocation Enabler for Resilient Network Slicing"
#   -> "Model_Predictive_Control-Based_Dynamic_RA_Enabler_for_Resilient_NS"
# and, in reverse, when matching alert titles against your keywords (DRL == deep reinforcement learning).
#
# Format:   Phrase: SHORT
# - Matching ignores case and treats spaces, underscores and hyphens alike
#   ("Network Slicing", "network-slicing" and "Network_Slicing" all become NS).
# - Longer phrases are applied first, so the order of lines does not matter.
# - To keep a phrase spelled out, delete or comment out its line (#), or map it to "".
# - Preview the effect on any title:   litsuite abbrev test "Your title here"
# - Re-learn from your filenames:       litsuite abbrev learn --project network_slicing
#
# The entries below were learned from the existing library (counts = files using them).

